[workspace]
members = [
  "crates/forge-models",
  "crates/forge-tools",
  "crates/forge-agent",
  "crates/forge-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/forge/forge"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "3", features = ["json"] }
